# docker-compose.yml — Disaster Structural Intelligence Platform
# Phase 0 foundation: PostGIS, Redis, backend placeholder, frontend placeholder.
# Later phases will flesh out the backend and frontend service implementations.
#
# Usage:
#   cp .env.example .env        # fill in your values
#   docker compose up --build
#
# All credentials flow from .env — no secrets are hardcoded here.

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL + PostGIS — primary data store
  # ---------------------------------------------------------------------------
  db:
    image: postgis/postgis:15-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sih_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sih_password}
      POSTGRES_DB: ${POSTGRES_DB:-weather_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sih_user} -d ${POSTGRES_DB:-weather_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Redis — Celery broker + result backend
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Backend — FastAPI application (Phase 4)
  # During Phase 0 this container just starts uvicorn against the minimal
  # backend stub so the compose file is valid and `docker compose up --build`
  # succeeds without error.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    restart: unless-stopped
    command: >
      uvicorn backend.main:app
        --host 0.0.0.0
        --port 8000
        --reload
        --log-level info
    volumes:
      - .:/app
      - ./data:/app/data          # persistent data / sample dataset
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sih_user:sih_password@db:5432/weather_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"
      timeout: 10s
      interval: 15s
      retries: 5
      start_period: 20s
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Celery Worker — background ingestion tasks (Phase 1+)
  # The worker shares the same image/code as the backend.
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: backend.Dockerfile
    restart: unless-stopped
    command: >
      celery -A backend.tasks.ingestion_worker worker
        --loglevel=info
        --concurrency=2
    volumes:
      - .:/app
      - ./data:/app/data
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sih_user:sih_password@db:5432/weather_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Frontend — Next.js dashboard (Phase 5)
  # During Phase 0 this service is a placeholder. The frontend/ directory must
  # contain at minimum a package.json and a Dockerfile before Phase 5.
  # To skip the frontend during early phases: docker compose up db redis backend worker
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules         # anonymous volume to preserve node_modules
      - /app/.next                # anonymous volume to preserve Next build cache
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  postgis_data:
    driver: local
  redis_data:
    driver: local

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  internal:
    driver: bridge
