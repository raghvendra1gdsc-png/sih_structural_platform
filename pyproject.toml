[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sih-structural-platform"
version = "0.1.0"
description = "Disaster Structural Intelligence Platform — SIH Hackathon 2026"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
backend = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "celery>=5.3.0",
    "redis>=4.6.0",
    "sqlalchemy>=2.0.0",
    "geoalchemy2>=0.14.0",
    "psycopg2-binary>=2.9.7",
    "pydantic-settings>=2.0.0",
    "alembic>=1.12.0",
]
ml = [
    "open-clip-torch",
    "sentence-transformers",
    "imagehash",
    "Pillow",
    "numpy",
    "pandas",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "httpx",
]

[tool.ruff]
line-length = 99
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
